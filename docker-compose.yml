services:
  douyin-chat-export:
    build: .
    container_name: douyin-chat-export
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - MODE=all
      - HEADLESS=true
      - SCRAPER_INCREMENTAL=true
      - SCRAPER_FILTER=
      - SCRAPER_SCHEDULE=
      - COOKIE_SECURE=true
      - TRUSTED_PROXY_CIDRS=127.0.0.1/32,::1/128
      - ENABLE_REMOTE_LOGIN=true
      - ENABLE_COOKIE_IMPORT=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
